<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aurora — Calendar, Notes &amp; AI</title>
<meta name="description" content="Aurora: a glass-textured calendar, notepad, and AI scheduling assistant." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- FullCalendar (CDN, no build step) -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===== Auth Gate ===== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card glass">
    <div class="brand">
      <span class="brand-orb"></span>
      <h1>Aurora</h1>
    </div>
    <p class="auth-sub">Your calendar, notes, and AI assistant — in one glass surface.</p>

    <form id="auth-form" class="auth-form">
      <input type="email" id="auth-email" placeholder="Email" required autocomplete="email" />
      <input type="password" id="auth-password" placeholder="Password" required autocomplete="current-password" minlength="6" />
      <button type="submit" id="auth-submit" class="btn btn-primary">Sign in</button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button id="google-signin" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <p class="auth-toggle">
      <span id="auth-toggle-text">New here?</span>
      <button id="auth-toggle-btn" type="button">Create an account</button>
    </p>
    <p id="auth-error" class="auth-error"></p>
  </div>
</div>

<!-- ===== App Shell ===== -->
<div id="app" class="app hidden">

  <!-- Sidebar -->
  <aside class="sidebar glass">
    <div class="brand brand-sm">
      <span class="brand-orb"></span>
      <h1>Aurora</h1>
    </div>

    <button class="btn btn-primary btn-block" id="new-event-btn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>
      New event
    </button>

    <div id="mini-cal" class="mini-cal"></div>

    <div class="sidebar-section">
      <h3>Filters</h3>
      <label class="check-row"><input type="checkbox" class="cat-filter" value="work" checked><span class="dot dot-blue"></span>Work</label>
      <label class="check-row"><input type="checkbox" class="cat-filter" value="personal" checked><span class="dot dot-mint"></span>Personal</label>
      <label class="check-row"><input type="checkbox" class="cat-filter" value="urgent" checked><span class="dot dot-coral"></span>Urgent</label>
      <label class="check-row"><input type="checkbox" class="cat-filter" value="other" checked><span class="dot dot-violet"></span>Other</label>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="user-chip" id="user-chip">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-meta">
        <span id="user-name">—</span>
        <button id="sign-out-btn">Sign out</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar glass">
      <div class="view-switch" id="view-switch">
        <button data-view="dayGridMonth" class="active">Month</button>
        <button data-view="timeGridWeek">Week</button>
        <button data-view="timeGridDay">Day</button>
        <button data-view="listWeek">Agenda</button>
      </div>
      <h2 id="cal-title">—</h2>
      <div class="nav-btns">
        <button id="cal-prev" aria-label="Previous">‹</button>
        <button id="cal-today">Today</button>
        <button id="cal-next" aria-label="Next">›</button>
      </div>
      <input id="search-input" type="search" placeholder="Search events & notes…" />
    </header>

    <div id="calendar" class="calendar-surface glass"></div>
  </main>

  <!-- Right dockable panel: Notes / AI Chat -->
  <aside class="side-panel glass" id="side-panel">
    <div class="panel-tabs">
      <button class="panel-tab active" data-panel="notes">📝 Notes</button>
      <button class="panel-tab" data-panel="chat">✨ AI Assistant</button>
    </div>

    <!-- Notes panel -->
    <section id="panel-notes" class="panel-body active">
      <button class="btn btn-secondary btn-block" id="new-note-btn">+ New note</button>
      <div id="notes-list" class="notes-list"></div>
    </section>

    <!-- Chat panel -->
    <section id="panel-chat" class="panel-body">
      <div id="chat-messages" class="chat-messages">
        <div class="chat-msg chat-ai">
          <div class="bubble">Hi! I'm your scheduling assistant. Ask me to add, move, or summarize events — e.g. <em>"Book a dentist appointment next Tuesday at 3pm."</em></div>
        </div>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Ask Aurora AI…" autocomplete="off" />
        <button type="submit" id="chat-send" aria-label="Send">➤</button>
      </form>
    </section>
  </aside>

  <!-- iOS-style floating dock (mobile) -->
  <nav class="dock glass" id="mobile-dock">
    <button data-target="calendar-view" class="dock-active">📅</button>
    <button data-target="notes-view">📝</button>
    <button data-target="chat-view">✨</button>
    <button id="dock-new-event">➕</button>
  </nav>
</div>

<!-- ===== Event Modal (iOS sheet style) ===== -->
<div id="event-modal" class="modal-overlay hidden">
  <div class="sheet glass">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="event-modal-title">New event</h3>
      <button id="event-delete-btn" class="btn-icon danger hidden" title="Delete">🗑</button>
    </div>
    <form id="event-form">
      <input type="hidden" id="event-id" />
      <label>Title
        <input id="event-title" type="text" required maxlength="120" placeholder="Add a title" />
      </label>
      <div class="row-2">
        <label>Starts
          <input id="event-start" type="datetime-local" required />
        </label>
        <label>Ends
          <input id="event-end" type="datetime-local" required />
        </label>
      </div>
      <label class="check-row inline"><input type="checkbox" id="event-allday" /> All day</label>
      <label>Category
        <select id="event-category">
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="urgent">Urgent</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Notes
        <textarea id="event-desc" rows="3" maxlength="2000" placeholder="Details, links, location…"></textarea>
      </label>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="event-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save event</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Note Modal ===== -->
<div id="note-modal" class="modal-overlay hidden">
  <div class="sheet glass">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3>Note</h3>
      <button id="note-delete-btn" class="btn-icon danger hidden" title="Delete">🗑</button>
    </div>
    <form id="note-form">
      <input type="hidden" id="note-id" />
      <input id="note-title" type="text" required maxlength="120" placeholder="Note title" />
      <textarea id="note-content" rows="8" maxlength="5000" placeholder="Write something…"></textarea>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="note-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save note</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<!-- Firebase (modular v10, CDN ESM) -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/calendar.js"></script>
<script type="module" src="js/notes.js"></script>
<script type="module" src="js/chatbot.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
